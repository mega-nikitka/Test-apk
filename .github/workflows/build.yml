name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project
        run: |
          mkdir -p proj/app/src/main/java/com/example/cam8k
          cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Cam8K"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.cam8k"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.cam8k"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera.any" />
              <application
                  android:label="Cam8K"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cp "$GITHUB_WORKSPACE/MainActivity.kt" app/src/main/java/com/example/cam8k/MainActivity.kt
      - name: Patch glass
        run: |
          cp Glass.kt proj/app/src/main/java/com/example/cam8k/Glass.kt
                    python3 -c "import re; p='proj/app/src/main/java/com/example/cam8k/Glass.kt'; s=open(p,encoding='utf-8').read(); s=re.sub(r'class GlassPanel\(.*?\n\}\n\n', '', s, flags=re.DOTALL); s=s.replace('panels.forEach { it.refresh() }', ''); s=s.replace('ui.postDelayed(this, 130)', ''); assert 'fun refresh()' not in s; open(p,'w',encoding='utf-8').write(s)"
      
          - name: Icon and signing
            run: |
          if [ ! -f cam8k.p12 ]; then
            keytool -genkeypair -keystore cam8k.p12 -storetype PKCS12 -storepass cam8kpass -keypass cam8kpass -alias cam8k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Cam8K"
            git config user.name github-actions
            git config user.email actions@github.com
            git add cam8k.p12
            git commit -m "Add signing key"
            git push
          fi
          cd proj/app
          cp "$GITHUB_WORKSPACE/cam8k.p12" cam8k.p12
          mkdir -p src/main/res/mipmap-anydpi-v26 src/main/res/drawable
          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOT'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOT
          cat > src/main/res/drawable/ic_bg.xml <<'EOT'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#161616" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOT
          cat > src/main/res/drawable/ic_fg.xml <<'EOT'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,54m-24,0a24,24 0 1,1 48,0a24,24 0 1,1 -48,0"/>
              <path android:fillColor="#202020" android:pathData="M54,54m-17,0a17,17 0 1,1 34,0a17,17 0 1,1 -34,0"/>
              <path android:fillColor="#E53935" android:pathData="M54,54m-8,0a8,8 0 1,1 16,0a8,8 0 1,1 -16,0"/>
          </vector>
          EOT
          sed -i 's|android:label="Cam8K"|android:label="Cam8K" android:icon="@mipmap/ic_launcher"|' src/main/AndroidManifest.xml
          cat >> build.gradle.kts <<'EOT'
          android {
              defaultConfig { versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt() }
              signingConfigs.getByName("debug") {
                  storeFile = file("cam8k.p12")
                  storePassword = "cam8kpass"
                  keyAlias = "cam8k"
                  keyPassword = "cam8kpass"
              }
          }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle -p proj assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cam8K-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
